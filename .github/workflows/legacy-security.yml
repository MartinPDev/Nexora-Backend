name: Legacy security regression
on:
  pull_request:
    paths:
      - "app/main.py"
      - "tests/test_legacy_*.py"
      - ".github/workflows/legacy-security.yml"
  push:
    branches:
      - "security/disable-unverified-plan-upgrades"
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install configuration test dependencies
        run: python -m pip install "pydantic>=2,<3" "pydantic-settings>=2,<3"
      - name: Compile backend and security tests
        run: |
          python -m compileall -q app tests
      - name: Execute standalone legacy security regressions
        run: |
          python -m unittest discover -s tests -p "test_legacy_*.py" -v
          python -m unittest discover -s tests -p "test_production_config_security.py" -v
