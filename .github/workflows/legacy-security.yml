name: Legacy security regression
on:
  pull_request:
    paths:
      - "app/main.py"
      - "tests/test_legacy_billing_*.py"
      - ".github/workflows/legacy-security.yml"
  push:
    branches:
      - "security/disable-unverified-plan-upgrades"
jobs:
  regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Compile backend and security tests
        run: |
          python -m py_compile app/main.py tests/test_legacy_billing_security.py tests/test_legacy_billing_ownership.py
      - name: Execute standalone legacy security regressions
        run: |
          python -m unittest discover -s tests -p "test_legacy_billing_*.py" -v
